[project]
name = "instatrip"
version = "0.1.0"
description = "Instagram saved collection → trip planning pipeline"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "yt-dlp>=2024.10.0",
    "faster-whisper>=1.0",
    "easyocr>=1.7",
    "anthropic>=0.39",
    "pydantic>=2.8",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "torch>=2.5",
    "torchvision>=0.20",
    "torchaudio>=2.5",
    "nvidia-cudnn-cu12>=9.0",
    "nvidia-cublas-cu12>=12.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
instatrip = "instatrip.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
